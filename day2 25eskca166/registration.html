<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css"/>
    
</head>
<body id="body">
    <div id="divform">
    <h1>REGISTRATION FORM</h1>
    <form class="background" id="frmregister">
        <label for="txtName">Name:</label>
        <input type="text" id="txtName" required placeholder="Name" class="rounded">
        <br><br>
        <label for="txtEmail">Email:</label>
        <input type="email" id="txtEmail" required placeholder="Email" class="rounded">
        <br><br>
        <label for="txtPassword">Password:</label>
        <input type="password" id="txtPassword" required placeholder="Password" class="rounded">
        <br><br
        <label for="txtConfirmPassword">Confirm Password:</label>
        <input type="password" id="txtConfirmPassword" required placeholder="Confirm Password" class="rounded">
        <br><br>
        <label for="rollNumber">Roll Number:</label>
        <input type="text" id="rollNumber" required placeholder="Roll Number" class="rounded">
        <br><br>
        <label for="txtPhone">Phone Number:</label>
        <input type="text" id="txtPhone" required placeholder="Phone Number" class="rounded">
        <br><br>
        <input type="radio" id="check-male" name="gender" checked/>
            <label for="check-male"> male:</label>


            <input type="radio" id="check-female" name="gender" checked/>
            <label for="check-female"> female:</label>

            <input type="radio" id="cgeck-transgender" name="gender" checked/>
            <label for="check-transgender">transgender</label>
            <br><br>
            <label for="dtDOB" >dob:</label>
            <input type="date" id="dtDOB" name="dtDOB" class="rounded"/>    
            <br><br>
            <label for="pwdpassword">password</label>
            <input type="password" id="pwdpassword" name="pwdpassword" class="rounded"/>
            <br><br>
        <button type="submit">Register</button>
    </form> 
    </div>
</body>
</html>
